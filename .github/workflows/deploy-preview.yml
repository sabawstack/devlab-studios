name: Deploy Preview

on:
  push:
    branches: [development]

concurrency:
  group: "deploy-preview-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CLOUDFLARE_ENV must be set for the build step, not the deploy step —
      # @astrojs/cloudflare bakes the resolved wrangler.jsonc environment
      # (bindings, D1 database, R2 bucket, Worker name) into
      # dist/server/wrangler.json at `astro build` time, before `wrangler
      # deploy` ever runs. Passing --env preview to wrangler alone deploys
      # whatever was baked in at build time, which defaults to production's
      # bindings if this env var isn't set here. See
      # docs/architecture/decisions/0005-preview-environment-build-time-env.md.
      - name: Build (preview environment)
        run: npm run build
        env:
          CLOUDFLARE_ENV: preview

      # OPS-06: preview D1 must already have every migration the code ships
      # with. Migrations are applied by hand (docs/operations.md), so a pending
      # one stops the deploy here instead of surfacing as a broken preview.
      # Reports the state in the log either way; a token without D1 read
      # access only warns, so this check can never block a deploy by itself.
      - name: Check preview D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: db49443cea6f0725d848254f17bcdab5
        run: |
          pending=0
          for db in devlab-studios-cms-preview devlab-pickleball-preview; do
            echo "::group::$db"
            if output=$(npx wrangler d1 migrations list "$db" --remote --env preview 2>&1); then
              echo "$output"
              if echo "$output" | grep -q "Migrations to be applied"; then
                echo "::error::$db has unapplied migrations. Apply them first: npx wrangler d1 migrations apply $db --remote --env preview"
                pending=1
              fi
            else
              echo "$output"
              echo "::warning::Could not read the migration state of $db (token scope?); not blocking."
            fi
            echo "::endgroup::"
          done
          exit $pending

      - name: Deploy to preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: db49443cea6f0725d848254f17bcdab5
          command: deploy --env preview
