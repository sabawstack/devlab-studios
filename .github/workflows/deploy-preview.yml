name: Deploy Preview

on:
  push:
    branches: [development]

concurrency:
  group: "deploy-preview-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CLOUDFLARE_ENV must be set for the build step, not the deploy step —
      # @astrojs/cloudflare bakes the resolved wrangler.jsonc environment
      # (bindings, D1 database, R2 bucket, Worker name) into
      # dist/server/wrangler.json at `astro build` time, before `wrangler
      # deploy` ever runs. Passing --env preview to wrangler alone deploys
      # whatever was baked in at build time, which defaults to production's
      # bindings if this env var isn't set here. See
      # docs/architecture/decisions/0005-preview-environment-build-time-env.md.
      - name: Build (preview environment)
        run: npm run build
        env:
          CLOUDFLARE_ENV: preview

      # OPS-06: preview D1 must already have every migration the code ships
      # with. Migrations are applied by hand (docs/operations.md), so a pending
      # one stops the deploy here instead of surfacing as a broken preview.
      # Reports the state in the log either way; a token without D1 read
      # access only warns, so this check can never block a deploy by itself.
      - name: Check preview D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: db49443cea6f0725d848254f17bcdab5
        run: |
          pending=0
          for db in devlab-studios-cms-preview devlab-pickleball-preview; do
            echo "::group::$db"
            if output=$(npx wrangler d1 migrations list "$db" --remote --env preview 2>&1); then
              echo "$output"
              if echo "$output" | grep -q "Migrations to be applied"; then
                echo "::error::$db has unapplied migrations. Apply them first: npx wrangler d1 migrations apply $db --remote --env preview"
                pending=1
              fi
            else
              echo "$output"
              echo "::warning::Could not read the migration state of $db (token scope?); not blocking."
            fi
            echo "::endgroup::"
          done
          exit $pending

      - name: Deploy to preview
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: db49443cea6f0725d848254f17bcdab5
          command: deploy --env preview

  # OPS-04: the mobile performance and accessibility budget on the deployed
  # preview (scripts/perf/budget.js). A miss fails this run before anything is
  # promoted to main.
  performance-budget:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighthouse budget on preview
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          node scripts/perf/lighthouse-budget.mjs https://devlab-studios-preview.stpnrey-agustinez.workers.dev

  # OPS-03: full-page screenshots of the canonical routes at three widths on
  # the deployed preview, kept as an artifact for the before/after review.
  # Never committed: pages can show personal data.
  visual-capture:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture the preview
        run: node scripts/visual/capture.mjs https://devlab-studios-preview.stpnrey-agustinez.workers.dev visual/preview

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-preview-${{ github.sha }}
          path: visual/
          retention-days: 30
