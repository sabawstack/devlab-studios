<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Source for public/og-pickleball.png (1200x630). Re-render with:
      npx playwright screenshot --viewport-size=1200,630 "file:///<absolute path>/scripts/og/pickleball-card.html" public/og-pickleball.png
    -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px;
        background: #0b1426;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #ffffff;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute; width: 640px; height: 640px; right: -180px; top: -220px; border-radius: 50%;
        background: radial-gradient(circle, rgba(69, 0, 255, 0.55) 0%, rgba(69, 0, 255, 0) 70%);
      }
      .wrap { position: relative; display: flex; align-items: center; height: 100%; padding: 0 72px; gap: 40px; }
      .left { flex: 1.15; }
      .eyebrow { font-size: 22px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #c6ff2e; }
      h1 { font-size: 74px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; margin-top: 18px; }
      h1 .free { color: #c6ff2e; }
      p.sub { margin-top: 24px; font-size: 27px; line-height: 1.4; color: #b5c4e1; max-width: 600px; }
      .chip {
        display: inline-flex; align-items: center; margin-top: 34px;
        padding: 14px 28px; border-radius: 16px; background: #4500ff;
        font-size: 24px; font-weight: 800; color: #ffffff;
      }
      .art { flex: 0.85; display: flex; align-items: center; justify-content: center; }
      .art svg { width: 100%; height: auto; }
      .brand { position: absolute; left: 72px; bottom: 40px; font-size: 21px; font-weight: 700; color: #b5c4e1; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="wrap">
      <div class="left">
        <div class="eyebrow">Devlab Pickleball</div>
        <h1>Run every court from one phone. <span class="free">Free.</span></h1>
        <p class="sub">Fair rotation, one-tap results and a live QR board. No sign-up.</p>
        <div class="chip">Start a free session</div>
      </div>
      <div class="art">
        <!-- A court seen from above, with the neon ball mid-rally. -->
        <svg viewBox="0 0 400 300" fill="none" aria-hidden="true">
          <rect x="30" y="40" width="340" height="230" rx="12" fill="#3055d6" />
          <rect x="50" y="58" width="300" height="194" stroke="#ffffff" stroke-width="3" />
          <path d="M200 58v194" stroke="#ffffff" stroke-width="5" />
          <path d="M150 58v194M250 58v194" stroke="#ffffff" stroke-width="2" opacity="0.7" />
          <path d="M50 155h100M250 155h100" stroke="#ffffff" stroke-width="2" opacity="0.7" />
          <circle cx="100" cy="110" r="14" fill="#11214d" stroke="#ffffff" stroke-width="3" />
          <circle cx="100" cy="200" r="14" fill="#11214d" stroke="#ffffff" stroke-width="3" />
          <circle cx="300" cy="110" r="14" fill="#11214d" stroke="#8d9bff" stroke-width="3" />
          <circle cx="300" cy="200" r="14" fill="#11214d" stroke="#8d9bff" stroke-width="3" />
          <path d="M118 104C160 20 230 10 262 60" stroke="#c6ff2e" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round" />
          <circle cx="268" cy="70" r="16" fill="#c6ff2e" />
          <circle cx="263" cy="65" r="2.4" fill="#0b1426" />
          <circle cx="273" cy="67" r="2.4" fill="#0b1426" />
          <circle cx="267" cy="76" r="2.4" fill="#0b1426" />
        </svg>
      </div>
    </div>
    <div class="brand">devlabstudios.com/pickleball</div>
  </body>
</html>
